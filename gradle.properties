# SaikaiPTT project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Skip the configuration phase when nothing affecting it has changed.
org.gradle.configuration-cache=true

kotlin.code.style=official

# Lets KSP register its generated sources the way it still does.
#
# AGP 9 owns the Kotlin compilation ("built-in Kotlin") and rejects the
# `kotlin.sourceSets` DSL, which is exactly how KSP's Gradle plugin adds
# build/generated/ksp/... to the compilation. Without this flag, applying KSP
# fails at configuration time before a single dependency is resolved:
#
#   Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with
#   built-in Kotlin. Solution: Use android.sourceSets DSL instead.
#
# The flag is AGP's own documented escape hatch for plugins that have not moved
# yet (developer.android.com/r/tools/built-in-kotlin), and it is not something
# this project can fix from its side: the registration happens inside KSP, and
# KSP cannot be upgraded independently because its version is pinned to the
# Kotlin version AGP itself provides (see gradle/libs.versions.toml).
#
# Remove it when a KSP release that uses `android.sourceSets` is available for
# our Kotlin version. Nothing else in this project uses `kotlin.sourceSets`, so
# the check is not protecting anything else here.
android.disallowKotlinSourceSets=false
