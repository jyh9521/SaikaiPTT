# SaikaiPTT dependency versions.
#
# Every version is pinned explicitly. "Whatever is newest on this machine" is
# not acceptable: docs/08_ReleaseChecklist.md section 51 requires that the same
# source and configuration reproduce the same Release build.
#
# Toolchain versions are ground truth from the developer's own environment
# (Android Studio Quail 4 / 2026.1.4), not recalled values. See CLAUDE.md 34.2.
#
# Adding a dependency requires justifying it against CLAUDE.md section 32:
# does the platform already provide this, is it maintained, what does it cost
# in APK size and memory, is it Android 11 compatible.

[versions]
# Build toolchain. Gradle itself is pinned in gradle/wrapper/gradle-wrapper.properties (9.6.0).
agp = "9.4.0"
kotlin = "2.2.10"

# Android SDK.
#
# minSdk 30 is a product requirement (Android 11, .claude/CLAUDE.md section 4).
#
# compileSdk and targetSdk are deliberately different, and that is the normal
# configuration rather than an oversight:
#
#   compileSdk 37 -- which APIs the code may compile against. Kept at the newest
#     available so dependencies stay upgradable; AndroidX libraries increasingly
#     require compiling against the current SDK. Changing it does not alter any
#     runtime behaviour.
#
#   targetSdk 36 -- which runtime behaviour changes the app opts in to. This is
#     the one that affects users, so it moves only after the behaviour has been
#     tested on real devices. Reviewed at release, see
#     docs/08_ReleaseChecklist.md section 3.
compileSdk = "37"
minSdk = "30"
targetSdk = "36"

# 升级依赖前，先确认它对 compileSdk 的要求。
#
# 这里踩过一次：把 compose-bom 升到 2026.08.00（Compose 1.12.0）而 compileSdk
# 还停在 36，会在 checkAarMetadata 阶段直接失败，连编译都走不到。lint 的
# GradleDependency 建议是**成组**的——它同时建议升 compileSdk，正是因为它推荐的
# 库版本需要。只采纳其中一半就会坏。
#
# Kotlin 有意停留在 2.2.10：AGP 9 内置 Kotlin 支持，编译器版本由 AGP 决定，
# 单独把 kotlin.plugin.compose 升到 2.4.10 会与内置编译器版本错配。

# UI
composeBom = "2026.08.00"
activityCompose = "1.13.0"
# Re-added at Task32, which is the first screen with a ViewModel. The catalog
# note below asks for the version to be checked when that happens: androidx-main
# is developing 2.12.0-alpha, so 2.11.0 is the last stable line, chosen the same
# way activity 1.13.0 was against its own 1.14.0-alpha.
lifecycle = "2.11.0"

# Annotation processing, for Room only. The version is Kotlin's own with KSP's
# appended, and the two halves are not independent: KSP publishes one release
# per Kotlin release and a mismatched pair fails at configuration time.
#
# 2.2.10-2.0.2 is the release built for Kotlin 2.2.10 -- read from the tags of
# github.com/google/ksp itself, not recalled (CLAUDE.md 34.2). The next tags in
# that repo are 2.2.20-*, so this is the last one for our Kotlin.
ksp = "2.2.10-2.0.2"

# Communication history (docs/05_DataModel.md section 10). DataStore stays for
# settings; a database is for structured records only (CLAUDE.md section 22).
#
# UNVERIFIED -- the one version in this file that is not ground truth. Neither
# the Gradle cache nor the IDE's own catalogue on the developer's machine has
# ever resolved Room, and Google Maven is not reachable from where this was
# written. Two further facts, both read from androidx-main:
#
#   - Room has moved to the group "androidx.room3", developing 3.1.0-alpha01.
#   - The old "androidx.room" group keeps its final 2.x releases on Maven.
#
# The 2.x line is used deliberately: its package names and API are known exactly
# here, while room3's are not, and a wrong guess about a package name is a
# rewrite rather than a version bump. 2.7.0 is the oldest release that supports
# KSP2, which the KSP version above is. Confirm the exact patch on first build
# and raise it; lint's GradleDependency check will report it once one runs.
room = "2.7.0"

# sherpa-onnx, the offline recognition engine (ADR-012). Pinned to the release
# whose published AAR was checked: every LOAD segment in all eight arm .so files
# is 16 KB aligned, which is what Vosk failed (ADR-011). Do not float this --
# a newer release is a different binary and the check has to be redone.
#
# No "v" prefix even though the git tag is v1.13.8. That is not a guess: the
# repository's own jitpack.yml at that tag runs
# `mvn install:install-file ... -DartifactId=sherpa-onnx -Dversion=1.13.8`,
# so 1.13.8 is the version JitPack will have on disk to serve.
#
# Confirmed by a build. Note which coordinate is below: JitPack publishes a
# multi-module project twice over -- an aggregate POM at the repository's own
# coordinate, com.github.k2-fsa:sherpa-onnx, and the real artifacts under a
# subgroup named after the repository, com.github.k2-fsa.sherpa-onnx. The
# aggregate has packaging=pom and carries no classes at all.
sherpaOnnx = "1.13.8"

# Storage / concurrency
# Versions taken from the Gradle cache, which is the only source of truth
# available here (CLAUDE.md 34.2). Lint's GradleDependency check reports newer
# ones once a build runs -- upgrade only after confirming the compileSdk each
# one requires.
coroutines = "1.9.0"
datastore = "1.1.1"

# Test
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# --- Removed at Task03 as unused ---------------------------------------------
# androidx.core:core-ktx and androidx.lifecycle:lifecycle-runtime-ktx shipped in
# the Android Studio template but are referenced by zero source files. They are
# removed rather than carried: CLAUDE.md section 32 requires justifying each
# dependency, and an unused one cannot be justified. Re-add them in the task that
# first needs them, with the version checked at that point.
#
# Task32 re-added androidx.lifecycle for lifecycle-viewmodel-compose, which is
# what gives the Home screen a ViewModel that outlives a rotation. Only that one
# artifact: lifecycle-runtime-compose would add collectAsStateWithLifecycle, and
# collectAsState from the Compose runtime already does what this screen needs.
# -----------------------------------------------------------------------------

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# Coroutines and Flow support for DAOs. Part of Room, versioned with it.
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Migration tests read the exported schema JSON; Task40 uses it.
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Offline Japanese recognition (ADR-012). Not on Maven Central; see the
# JitPack repository declared in settings.gradle.kts.
#
# The group is the subgroup, with a dot before "sherpa-onnx". Depending on
# com.github.k2-fsa:sherpa-onnx instead resolves, downloads and compiles
# against nothing: it is the aggregate POM, and the build fails with every
# com.k2fsa reference unresolved rather than with a missing dependency.
sherpa-onnx = { group = "com.github.k2-fsa.sherpa-onnx", name = "sherpa-onnx", version.ref = "sherpaOnnx" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# :core is a plain JVM module, so it needs the Kotlin JVM plugin explicitly.
# The :app module does not: AGP 9 has built-in Kotlin support.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
