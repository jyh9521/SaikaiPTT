# SaikaiPTT dependency versions.
#
# Every version is pinned explicitly. "Whatever is newest on this machine" is
# not acceptable: docs/08_ReleaseChecklist.md section 51 requires that the same
# source and configuration reproduce the same Release build.
#
# Toolchain versions are ground truth from the developer's own environment
# (Android Studio Quail 4 / 2026.1.4), not recalled values. See CLAUDE.md 34.2.
#
# Adding a dependency requires justifying it against CLAUDE.md section 32:
# does the platform already provide this, is it maintained, what does it cost
# in APK size and memory, is it Android 11 compatible.

[versions]
# Build toolchain. Gradle itself is pinned in gradle/wrapper/gradle-wrapper.properties (9.6.0).
agp = "9.4.0"
kotlin = "2.2.10"

# Android SDK. minSdk 30 is a product requirement (Android 11, .claude/CLAUDE.md section 4).
# compileSdk/targetSdk 36 is Android 16. API 36.1 is installed on this machine but is a
# minor SDK version with younger tooling support, and the binding constraint for this
# product is low-end Android 11 stability, not newest-API access.
compileSdk = "36"
minSdk = "30"
targetSdk = "36"

# UI / Test 版本来自 Task03 的 lint 实测报告（GradleDependency 检查会报出当前可用
# 版本），而不是猜测。Android Studio 模板自带的是较旧的值。
#
# Kotlin 有意停留在 2.2.10：AGP 9 内置 Kotlin 支持，编译器版本由 AGP 决定，
# 单独把 kotlin.plugin.compose 升到 2.4.10 会与内置编译器版本错配。
# Kotlin 升级需要连同 AGP 一起评估，属于独立变更。

# UI
composeBom = "2026.08.00"
activityCompose = "1.13.0"

# Test
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# --- Removed at Task03 as unused ---------------------------------------------
# androidx.core:core-ktx and androidx.lifecycle:lifecycle-runtime-ktx shipped in
# the Android Studio template but are referenced by zero source files. They are
# removed rather than carried: CLAUDE.md section 32 requires justifying each
# dependency, and an unused one cannot be justified. Re-add them in the task that
# first needs them, with the version checked at that point.
# -----------------------------------------------------------------------------

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
